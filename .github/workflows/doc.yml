name: doc

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install documentation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends doxygen
          npm install --global less@4.2.2 less-plugin-clean-css@1.5.1
          mkdir -p "${{ runner.temp }}/fmt-docs"
      - name: Build documentation
        working-directory: ${{ runner.temp }}/fmt-docs
        env:
          KEY: ${{ secrets.KEY }}
        run: python "$GITHUB_WORKSPACE/support/build-docs.py"
      - name: Preserve built documentation
        uses: actions/upload-artifact@v7
        with:
          name: fmt-documentation
          path: ${{ runner.temp }}/fmt-docs/html
          if-no-files-found: error
