name: linux

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        cxx: [g++, clang++]
        build_type: [Debug, Release]
        std: [11, 17, 20]
        shared: [OFF]
        include:
          - {cxx: g++, build_type: Debug, std: 14, shared: OFF}
          - {cxx: clang++, build_type: Debug, std: 14, shared: OFF}
          - {cxx: g++, build_type: Debug, std: 20, shared: ON}
          - {cxx: clang++, build_type: Debug, std: 20, shared: ON}
    env:
      TZ: Asia/Yekaterinburg
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++ clang cmake locales-all
      - name: Configure
        env:
          CXX: ${{ matrix.cxx }}
        run: >-
          cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DCMAKE_CXX_STANDARD=${{ matrix.std }} -DBUILD_SHARED_LIBS=${{ matrix.shared }}
          -DFMT_DOC=OFF -DCMAKE_CXX_VISIBILITY_PRESET=hidden
          -DCMAKE_VISIBILITY_INLINES_HIDDEN=ON -DFMT_PEDANTIC=ON -DFMT_WERROR=ON
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure -C ${{ matrix.build_type }}
