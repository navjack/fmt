name: macos

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os: [macos-15-intel]
        build_type: [Debug, Release]
        std: [11, 17, 20]
        shared: [OFF]
        include:
          - {os: macos-15-intel, build_type: Debug, std: 20, shared: ON}
          - {os: macos-15-intel, build_type: Release, std: 20, shared: ON}
          - {os: macos-15, build_type: Release, std: 20, shared: ON}
    runs-on: ${{ matrix.os }}
    env:
      TZ: Asia/Yekaterinburg
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: >-
          cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DCMAKE_CXX_STANDARD=${{ matrix.std }} -DBUILD_SHARED_LIBS=${{ matrix.shared }}
          -DCMAKE_CXX_VISIBILITY_PRESET=hidden -DCMAKE_VISIBILITY_INLINES_HIDDEN=ON
          -DFMT_DOC=OFF -DFMT_PEDANTIC=ON -DFMT_WERROR=ON
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure -C ${{ matrix.build_type }}
