name: windows

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        platform: [Win32, x64]
        standard: [14, 17, 20]
        shared: [OFF, ON]
        build_type: [Debug, Release]
    env:
      TZ: Asia/Yekaterinburg
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: >-
          cmake -S . -B build -G "Visual Studio 17 2022" -T v143
          -A ${{ matrix.platform }} -DCMAKE_CXX_STANDARD=${{ matrix.standard }}
          -DBUILD_SHARED_LIBS=${{ matrix.shared }} -DFMT_DOC=OFF
      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }} --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure -C ${{ matrix.build_type }}

  mingw:
    runs-on: windows-2022
    defaults:
      run:
        shell: msys2 {0}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        sys: [mingw64, ucrt64]
    env:
      TZ: Asia/Yekaterinburg
    steps:
      - uses: msys2/setup-msys2@v2
        with:
          update: true
          msystem: ${{ matrix.sys }}
          pacboy: cc:p cmake:p ninja:p lld:p
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -G Ninja -DBUILD_SHARED_LIBS=ON -DFMT_DOC=OFF -DCMAKE_BUILD_TYPE=Debug
        env:
          LDFLAGS: -fuse-ld=lld
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure
